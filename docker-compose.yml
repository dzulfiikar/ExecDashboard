services:
  exec-db:
    image: mongo:7.0
    ports:
      - "27000:27017"
    volumes:
      - "execdb-data:/data/db"
    networks:
      - hygieia_default
    environment:
      - MONGO_INITDB_DATABASE=analyticsdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet localhost:27017/analyticsdb --eval 'db.runCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 5

  exec-db-setup:
    build: exec-db
    depends_on:
      exec-db:
        condition: service_healthy
    networks:
      - hygieia_default
    environment:
      - MONGO_HOST=exec-db

  exec-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    volumes:
      - "./config/api:/var/app/config"
    depends_on:
      exec-db-setup:
        condition: service_completed_successfully
    networks:
      - hygieia_default

  exec-analysis:
    build:
      context: .
      dockerfile: Dockerfile.analysis
    volumes:
      - "./config/analysis:/var/app/config"
    depends_on:
      exec-db-setup:
        condition: service_completed_successfully
    networks:
      - hygieia_default

  exec-ui:
    build: exec-ui
    ports:
      - "4200:80"
    depends_on:
      - exec-api
    environment:
      - API_URL=http://exec-api:8080
    networks:
      - hygieia_default

volumes:
  execdb-data:

networks:
  hygieia_default:
    driver: bridge